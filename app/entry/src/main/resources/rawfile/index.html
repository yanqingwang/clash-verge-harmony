<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clash Verge — OHOS shell</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #101820; color: #e6edf3;
           display: grid; place-items: center; height: 100vh; margin: 0; }
    .card { text-align: center; padding: 2rem; border: 1px solid #2a3441; border-radius: 12px; }
    #result { font-size: 1.2rem; color: #3fb950; min-height: 1.5em; }
    button { margin-top: 1rem; padding: .5rem 1.2rem; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Clash Verge · HarmonyOS shell</h2>
    <div>ArkWeb host + ohosBridge seam (P0)</div>
    <div id="result">not called</div>
    <button onclick="probe()">call ohosBridge.ping()</button>
  </div>
  <script>
    function probe() {
      const el = document.getElementById('result')
      try {
        el.textContent = ohosBridge.ping() + ' — ' + ohosBridge.version()
      } catch (e) {
        el.textContent = 'bridge error: ' + e
      }
    }
    window.onload = () => { try { probe() } catch (e) {} }
  </script>
</body>
</html>
