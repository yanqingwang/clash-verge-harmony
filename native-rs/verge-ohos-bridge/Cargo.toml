[package]
name = "verge-ohos-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
strip = true
